load_module modules/ngx_stream_module.so;

worker_processes 1;
error_log /tmp/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

stream {
    server {
        listen 8080 udp;
        proxy_pass udp://127.0.0.1:8000;
        tcp_nodelay on;                  # Low-latency streaming
        proxy_connect_timeout 10s;       # Wait 10s to connect to Jellyfin
        proxy_timeout 3600s;             # Keep streams alive for 1 hour
    }
}
