worker_processes 1;

# The container runs as an unprivileged user, so every path nginx writes to
# has to be writable by it.
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;

    server {
        listen 8080;
        server_name _;

        # NOTE: the root is the parent of the "hls" directory. Using
        # "root /srv/www/hls" together with "location /hls/" would resolve
        # requests to /srv/www/hls/hls/... and 404 everything.
        root /srv/www;

        # The channel list that Jellyfin's M3U tuner consumes.
        #
        # Jellyfin requires the channel entry to be an absolute URL: relative
        # paths are rejected and the channel is silently skipped. $http_host
        # echoes back the host:port the client used to reach us, so the
        # generated URL is always reachable from Jellyfin's point of view.
        location = /playlist.m3u8 {
            default_type application/vnd.apple.mpegurl;
            add_header Cache-Control "no-store" always;

            # Written by the entrypoint, holds "set $channel_name ...;".
            include /tmp/nginx-channel.conf;

            return 200 "#EXTM3U\n#EXTINF:-1,$channel_name\nhttp://$http_host/hls/live.m3u8\n";
        }

        # The HLS media playlist and its segments, written by ffmpeg.
        location /hls/ {
            add_header Cache-Control "no-store" always;
        }
    }
}
