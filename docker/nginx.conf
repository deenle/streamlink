worker_processes 1;

error_log /tmp/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

# This is the magic part. The 'stream' block handles raw TCP traffic.
stream {
    server {
        listen 8080; # This is your CONTAINER_PORT
        proxy_pass 127.0.0.1:8000; # Forwards traffic to FFmpeg
        
        # TCP optimizations for streaming
        proxy_tcp_nodelay on;
        proxy_socket_keepalive on;
    }
}
