# The only value you have to provide is the stream link:
#
#   STREAM_URL=https://live.vkvideo.ru/CHANNEL
#
# Variables are in a docker/.env.example

services:
  streamlink:
    image: ghcr.io/deenle/streamlink:latest
    container_name: streamlink-vk
    restart: unless-stopped
    networks:
      - ${DOCKER_NETWORK}

    environment:
      # The stream to watch. This is the only required value.
      - STREAM_URL=${STREAM_URL}
      - UID=${UID}
      - GID=${GID}
      # Stream quality, e.g. best, worst, 720p.
      - STREAM_QUALITY=${STREAM_QUALITY:-best}
      # Channel name shown in Jellyfin's Live TV guide.
      - CHANNEL_NAME=${CHANNEL_NAME:-Stream}
      - CONTAINER_PORT=${CONTAINER_PORT:-8080}
      - ENABLE_RECORDING=${ENABLE_RECORDING:-true}

    volumes:
      # Recordings are written here, e.g. /mnt/tank/recordings
      - ${RECORDINGS_DIR:-./recordings}:/records
      # The HLS working directory.
      # Kept on a volume so that the segments survive a container restart.
      - streamlink-hls:/srv/www/hls

    security_opt:
      - no-new-privileges=true
    stop_grace_period: "20s" #optional
    
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

networks:
  ${DOCKER_NETWORK}:
    external: true


volumes:
  streamlink-hls:
